name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Angular build
        run: npx ng build

      - name: Angular unit tests
        run: npx ng test --watch=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup Mono
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-complete

      - name: Install NuGet CLI
        run: |
          sudo curl -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/v6.9.1/nuget.exe
          printf '#!/bin/bash\nmono /usr/local/bin/nuget.exe "$@"\n' | sudo tee /usr/local/bin/nuget > /dev/null
          sudo chmod +x /usr/local/bin/nuget

      - name: Restore NuGet packages
        run: nuget restore angularjs-asp-net48-mvc5.sln

      - name: Build .NET solution
        run: xbuild angularjs-asp-net48-mvc5.sln
