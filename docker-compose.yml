services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - App__Title=AngularJS with ASP.NET Core
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "dotnet --info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
